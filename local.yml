---
- name: Deploy 3X-UI with VLESS+Reality, nginx, and ACME
  hosts: vps
  serial: 1
  become: yes
  become_user: root
  vars:
    ansible_user: "def"
    # === Основные параметры ===
    domain: "restart2d.site"
    panel_domain: "panel.{{ domain }}"           # поддомен для панели
    acme_email: "test.1977@gmail.com"
    acme_certificate_force_update: false
    panel_port: 2053
    panel_user: "admin"
    panel_pass: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"
    x_ui_binary: "/usr/bin/x-ui"
    reset_3xui_db: false          # установите true, чтобы сбросить базу данных 3X-UI
    panel_api_token: "ВАШ_ТОКЕН_ЗДЕСЬ"   # API-токен панели 3X-UI
    panel_external_access: false   # установите true, чтобы открыть панель снаружи через nginx

    # === Параметры прокси ===
    xray_port: 443
    reality_dest: "login.vk.ru:443"
    reality_server_name: "login.vk.ru"

    # === Docker: "official_script" или "distribution" ===
    docker_install_method: "official_script"

    # === Дополнительные настройки ===
    enable_ufw: true
    ssh_port: 22
    enable_bbr: true
    work_dir: "/opt/3x-ui"
    cert_dir: "{{ work_dir }}/3x-ui-data/cert"
    db_dir: "{{ work_dir }}/3x-ui-data/db"
    acme_webroot: "/var/www/acme"
    nginx_https_port: 8443

    # === Пакеты по дистрибутивам ===
    common_packages:
      - curl
      - wget
      - git
      - nginx
      - python3
      - jq
      - openssl
      - dnsutils

    ubuntu_packages:
      - ufw
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release

    debian_packages:
      - ufw
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release

    centos_packages:
      - firewalld
      - epel-release
      - ca-certificates
      - gnupg

    fedora_packages:
      - firewalld
      - ca-certificates
      - gnupg

    docker_distro_packages:
      ubuntu:
        - docker.io
        - docker-compose-v2
        - containerd
      debian:
        - docker.io
        - docker-compose-v2
        - containerd
      centos:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-compose-plugin
      fedora:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-compose-plugin

  tasks:
    # ============================================================
    # TAG: system_detect
    # ============================================================
    - name: "[system_detect] Определение дистрибутива"
      block:
        - name: Сбор информации о системе
          ansible.builtin.setup:
            filter: ansible_distribution

        - name: Установка факта дистрибутива
          ansible.builtin.set_fact:
            distro_name: "{{ ansible_distribution | lower }}"

        - name: Вывод информации о дистрибутиве
          ansible.builtin.debug:
            msg: "Определен дистрибутив: {{ ansible_distribution }} ({{ distro_name }})"
      tags:
        - system_detect
        - always

    # ============================================================
    # TAG: system_update
    # ============================================================
    - name: "[system_update] Обновление системы и установка пакетов"
      block:
        - name: Обновление кэша пакетов
          ansible.builtin.package:
            update_cache: yes
            cache_valid_time: 3600

        - name: Установка общих пакетов
          ansible.builtin.package:
            name: "{{ common_packages }}"
            state: present

        - name: Установка пакетов для Ubuntu
          ansible.builtin.package:
            name: "{{ ubuntu_packages }}"
            state: present
          when: distro_name == 'ubuntu'

        - name: Установка пакетов для Debian
          ansible.builtin.package:
            name: "{{ debian_packages }}"
            state: present
          when: distro_name == 'debian'

        - name: Установка пакетов для CentOS
          ansible.builtin.package:
            name: "{{ centos_packages }}"
            state: present
          when: distro_name in ['centos', 'red hat', 'redhat']

        - name: Установка пакетов для Fedora
          ansible.builtin.package:
            name: "{{ fedora_packages }}"
            state: present
          when: distro_name == 'fedora'
      tags:
        - system_update

    # ============================================================
    # TAG: system_tuning
    # ============================================================
    - name: "[system_tuning] Оптимизация системы (BBR)"
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: net.core.default_qdisc, value: fq }
        - { name: net.ipv4.tcp_congestion_control, value: bbr }
      when: enable_bbr | bool
      tags:
        - system_tuning

    # ============================================================
    # TAG: firewall_configure
    # ============================================================
    - name: "[firewall_configure] Настройка файрвола (UFW)"
      block:
        - name: Разрешение портов (UFW)
          community.general.ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop:
            - "{{ ssh_port }}"
            - "80"
            - "{{ xray_port }}"
            - "{{ nginx_https_port }}"
          when: distro_name in ['ubuntu', 'debian']

        - name: Включение UFW
          community.general.ufw:
            state: enabled
            policy: deny
          when:
            - distro_name in ['ubuntu', 'debian']
            - enable_ufw | bool

        - name: Разрешение портов (firewalld для CentOS/Fedora)
          ansible.builtin.firewalld:
            port: "{{ item }}/tcp"
            permanent: yes
            state: enabled
            immediate: yes
          loop:
            - "{{ ssh_port }}"
            - "80"
            - "{{ xray_port }}"
            - "{{ nginx_https_port }}"
          when:
            - distro_name in ['centos', 'red hat', 'redhat', 'fedora']
            - enable_ufw | bool
      tags:
        - firewall_configure

    # ============================================================
    # TAG: dns_check
    # ============================================================
    - name: "[dns_check] Проверка DNS-записей домена и поддомена"
      block:
        - name: Получение внешнего IP сервера
          ansible.builtin.shell: |
            curl -s ifconfig.me
          register: server_ip
          changed_when: false

        - name: Получение A-записи основного домена
          ansible.builtin.shell: |
            dig +short {{ domain }} A | head -1
          register: domain_ip
          changed_when: false

        - name: Получение A-записи панельного поддомена
          ansible.builtin.shell: |
            dig +short {{ panel_domain }} A | head -1
          register: panel_domain_ip
          changed_when: false

        - name: Вывод информации о DNS
          ansible.builtin.debug:
            msg: |
              === DNS CHECK ===
              IP сервера: {{ server_ip.stdout }}
              A-запись {{ domain }}: {{ domain_ip.stdout }}
              A-запись {{ panel_domain }}: {{ panel_domain_ip.stdout }}
              DNS основного домена указывает на сервер: {{ server_ip.stdout == domain_ip.stdout }}
              DNS панельного домена указывает на сервер: {{ server_ip.stdout == panel_domain_ip.stdout }}

        - name: Остановка при несовпадении DNS
          ansible.builtin.fail:
            msg: |
              DNS-записи не указывают на этот сервер.
              Основной домен {{ domain }} ожидает {{ server_ip.stdout }}, получен {{ domain_ip.stdout }}
              Панельный домен {{ panel_domain }} ожидает {{ server_ip.stdout }}, получен {{ panel_domain_ip.stdout }}
              Исправьте A-записи и запустите плейбук заново.
          when: server_ip.stdout != domain_ip.stdout or server_ip.stdout != panel_domain_ip.stdout

        - name: DNS проверка пройдена успешно
          ansible.builtin.debug:
            msg: "DNS-записи для {{ domain }} и {{ panel_domain }} корректно указывают на сервер."
          when: server_ip.stdout == domain_ip.stdout and server_ip.stdout == panel_domain_ip.stdout
      tags:
        - dns_check
        - always

    # ============================================================
    # TAG: directories_create
    # ============================================================
    - name: "[directories_create] Создание рабочих директорий"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ work_dir }}"
        - "{{ cert_dir }}"
        - "{{ db_dir }}"
        - "{{ acme_webroot }}"
      tags:
        - directories_create

    # ============================================================
    # TAG: nginx_configure
    # ============================================================
    - name: "[nginx_configure] Предварительная настройка nginx для ACME"
      block:
        - name: Полная очистка всех конфигураций nginx
          ansible.builtin.shell: |
            rm -f /etc/nginx/sites-enabled/*
            rm -f /etc/nginx/sites-available/*
            rm -f /etc/nginx/conf.d/*
            sed -i '/ssl_certificate/d; /ssl_certificate_key/d' /etc/nginx/nginx.conf 2>/dev/null || true
          ignore_errors: yes

        - name: Создание временной конфигурации nginx для ACME
          ansible.builtin.copy:
            content: |
              server {
                  listen 80;
                  server_name {{ domain }} {{ panel_domain }};
                  root {{ acme_webroot }};

                  location /.well-known/acme-challenge/ {
                      root {{ acme_webroot }};
                  }

                  location / {
                      return 200 "OK";
                  }
              }
            dest: "/etc/nginx/sites-available/3x-ui-{{ domain }}.conf"
            mode: '0644'

        - name: Включение сайта
          ansible.builtin.file:
            src: "/etc/nginx/sites-available/3x-ui-{{ domain }}.conf"
            dest: "/etc/nginx/sites-enabled/3x-ui-{{ domain }}.conf"
            state: link

        - name: Остановка nginx
          ansible.builtin.systemd:
            name: nginx
            state: stopped
          ignore_errors: yes

        - name: Освобождение порта 80
          ansible.builtin.shell: |
            fuser -k 80/tcp || true
          ignore_errors: yes

        - name: Проверка конфигурации nginx
          ansible.builtin.shell: |
            nginx -t
          register: nginx_test
          ignore_errors: yes

        - name: Вывод ошибки конфигурации при проблемах
          ansible.builtin.debug:
            var: nginx_test.stderr_lines
          when: nginx_test.rc != 0

        - name: Запуск nginx
          ansible.builtin.systemd:
            name: nginx
            state: started
            daemon_reload: yes
          when: nginx_test.rc == 0

        - name: Проверка доступности порта 80
          ansible.builtin.wait_for:
            port: 80
            state: started
            delay: 2
            timeout: 10
          when: nginx_test.rc == 0
      tags:
        - nginx_configure
        - acme_certificate

    # ============================================================
    # TAG: acme_certificate
    # ============================================================
    - name: "[acme_certificate] Установка acme.sh и выпуск сертификата"
      block:
        - name: Проверка DNS перед выпуском сертификата
          block:
            - name: Получение внешнего IP сервера
              ansible.builtin.shell: |
                curl -s ifconfig.me
              register: acme_server_ip
              changed_when: false

            - name: Получение A-записи основного домена
              ansible.builtin.shell: |
                dig +short {{ domain }} A | head -1
              register: acme_domain_ip
              changed_when: false

            - name: Получение A-записи панельного домена
              ansible.builtin.shell: |
                dig +short {{ panel_domain }} A | head -1
              register: acme_panel_ip
              changed_when: false

            - name: Вывод информации о DNS
              ansible.builtin.debug:
                msg: |
                  === DNS CHECK (ACME) ===
                  IP сервера: {{ acme_server_ip.stdout }}
                  A-запись {{ domain }}: {{ acme_domain_ip.stdout }}
                  A-запись {{ panel_domain }}: {{ acme_panel_ip.stdout }}

            - name: Остановка при несовпадении DNS
              ansible.builtin.fail:
                msg: |
                  DNS не указывает на сервер.
                  Основной домен {{ domain }}: ожидается {{ acme_server_ip.stdout }}, получен {{ acme_domain_ip.stdout }}
                  Панельный домен {{ panel_domain }}: ожидается {{ acme_server_ip.stdout }}, получен {{ acme_panel_ip.stdout }}
                  Исправьте записи и повторите.
              when: acme_server_ip.stdout != acme_domain_ip.stdout or acme_server_ip.stdout != acme_panel_ip.stdout

        - name: Установка acme.sh
          ansible.builtin.shell: |
            curl -fsSL https://get.acme.sh | sh -s email={{ acme_email }}
          args:
            creates: /root/.acme.sh/acme.sh

        - name: Установка Let's Encrypt как CA по умолчанию
          ansible.builtin.shell: |
            /root/.acme.sh/acme.sh --set-default-ca --server letsencrypt

        - name: Регистрация аккаунта
          ansible.builtin.shell: |
            /root/.acme.sh/acme.sh --register-account -m {{ acme_email }}
          ignore_errors: yes

        - name: Проверка наличия сертификатов в cert_dir
          ansible.builtin.stat:
            path: "{{ cert_dir }}/fullchain.cer"
          register: cert_stat

        - name: Проверка наличия приватного ключа в cert_dir
          ansible.builtin.stat:
            path: "{{ cert_dir }}/private.key"
          register: key_stat

        - name: Проверка валидности сертификата
          ansible.builtin.shell: |
            openssl x509 -in "{{ cert_dir }}/fullchain.cer" -noout -subject 2>&1 || echo "INVALID"
          register: cert_valid
          when: cert_stat.stat.exists and cert_stat.stat.size | default(0) > 0
          changed_when: false
          ignore_errors: yes

        - name: Определение необходимости выпуска сертификата
          ansible.builtin.set_fact:
            need_new_cert: "{{ 
              not cert_stat.stat.exists or 
              not key_stat.stat.exists or 
              cert_stat.stat.size | default(0) < 100 or 
              (cert_valid.stdout | default('')) == 'INVALID' or
              acme_certificate_force_update | bool 
            }}"

        - name: Вывод информации о необходимости обновления
          ansible.builtin.debug:
            msg: |
              Сертификат существует: {{ cert_stat.stat.exists | default(false) }}
              Размер: {{ cert_stat.stat.size | default(0) }} байт
              Валидность: {{ cert_valid.stdout | default('N/A') }}
              Ключ существует: {{ key_stat.stat.exists | default(false) }}
              Принудительное обновление: {{ acme_certificate_force_update }}
              Нужен новый сертификат: {{ need_new_cert }}

        - name: Выпуск сертификата Let's Encrypt (основной + панельный домены)
          ansible.builtin.shell: |
            /root/.acme.sh/acme.sh --issue -d {{ domain }} -d {{ panel_domain }} -w {{ acme_webroot }} --keylength ec-256 --force
          register: acme_issue
          when: need_new_cert | bool

        - name: Проверка успешности выпуска
          ansible.builtin.stat:
            path: "/root/.acme.sh/{{ domain }}_ecc/fullchain.cer"
          register: acme_cert_file
          when: need_new_cert | bool

        - name: Установка сертификата в cert_dir
          ansible.builtin.shell: |
            /root/.acme.sh/acme.sh --install-cert -d {{ domain }} --ecc \
              --fullchain-file "{{ cert_dir }}/fullchain.cer" \
              --key-file "{{ cert_dir }}/private.key" \
              --reloadcmd "systemctl reload nginx"
          when:
            - need_new_cert | bool
            - acme_cert_file.stat.exists | default(false)

        - name: Пропуск выпуска сертификата
          ansible.builtin.debug:
            msg: "Сертификат для {{ domain }} уже существует и валиден. Пропускаем выпуск."
          when: not need_new_cert | bool
      tags:
        - acme_certificate

    # ============================================================
    # TAG: nginx_final_configure
    # ============================================================
    - name: "[nginx_final_configure] Финальная настройка nginx (управляемый доступ)"
      block:
        # ---------- Определение пути к панели ----------
        - name: Определить panel_proxy_path
          block:
            - name: Прочитать сохранённый путь
              ansible.builtin.shell: cat /root/panel-path.txt 2>/dev/null || echo ""
              register: saved_panel_path
              changed_when: false
    
            - name: Установить panel_proxy_path (прочитанный или новый)
              ansible.builtin.set_fact:
                panel_proxy_path: "{{ saved_panel_path.stdout if saved_panel_path.stdout != '' else '/panel-' + lookup('password', '/dev/null length=12 chars=hexdigits') }}"
    
            - name: Сохранить путь на будущее, если он новый
              ansible.builtin.copy:
                content: "{{ panel_proxy_path }}"
                dest: /root/panel-path.txt
                mode: '0600'
              when: saved_panel_path.stdout == ''
    
        # ---------- Проверка сертификата ----------
        - name: Проверка наличия валидного сертификата
          ansible.builtin.stat:
            path: "{{ cert_dir }}/fullchain.cer"
          register: final_cert_check
    
        - name: Проверка валидности сертификата
          ansible.builtin.shell: |
            openssl x509 -in "{{ cert_dir }}/fullchain.cer" -noout -subject 2>&1 || echo "INVALID"
          register: cert_valid_check
          when: final_cert_check.stat.exists and final_cert_check.stat.size | default(0) >= 100
          changed_when: false
          ignore_errors: yes
    
        - name: Установка факта валидности сертификата
          ansible.builtin.set_fact:
            cert_is_valid: "{{ cert_valid_check.stdout | default('INVALID') != 'INVALID' }}"
          when: final_cert_check.stat.exists
    
        - name: Пропуск настройки HTTPS при отсутствии валидного сертификата
          ansible.builtin.debug:
            msg: "Сертификат не найден или невалиден. Пропускаем настройку HTTPS."
          when: not cert_is_valid | default(false)
    
        - name: Полная очистка всех конфигураций nginx
          ansible.builtin.shell: |
            rm -f /etc/nginx/sites-enabled/*
            rm -f /etc/nginx/sites-available/*
            rm -f /etc/nginx/conf.d/*
            sed -i '/ssl_certificate/d; /ssl_certificate_key/d' /etc/nginx/nginx.conf 2>/dev/null || true
          ignore_errors: yes
          when: cert_is_valid | default(false)
    
        # ---------- Конфигурация без внешнего доступа к панели ----------
        - name: Создание конфигурации nginx (без прокси к панели)
          ansible.builtin.copy:
            content: |
              server {
                  listen 80;
                  server_name {{ domain }} {{ panel_domain }};
                  root {{ acme_webroot }};
    
                  location /.well-known/acme-challenge/ {
                      root {{ acme_webroot }};
                  }
    
                  location / {
                      return 301 https://$host:{{ nginx_https_port }}$request_uri;
                  }
              }
    
              server {
                  listen {{ nginx_https_port }} ssl http2;
                  server_name {{ domain }};
    
                  ssl_certificate {{ cert_dir }}/fullchain.cer;
                  ssl_certificate_key {{ cert_dir }}/private.key;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    
                  location / {
                      return 200 "OK";
                  }
              }
    
              server {
                  listen {{ nginx_https_port }} ssl http2;
                  server_name {{ panel_domain }};
    
                  ssl_certificate {{ cert_dir }}/fullchain.cer;
                  ssl_certificate_key {{ cert_dir }}/private.key;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    
                  location / {
                      return 200 "OK";
                  }
              }
            dest: "/etc/nginx/sites-available/3x-ui-{{ domain }}.conf"
            mode: '0644'
          when: cert_is_valid | default(false) and not (panel_external_access | bool)
    
        # ---------- Конфигурация с внешним доступом к панели ----------
        - name: Создание конфигурации nginx (с прокси к панели)
          ansible.builtin.copy:
            content: |
              server {
                  listen 80;
                  server_name {{ domain }} {{ panel_domain }};
                  root {{ acme_webroot }};
    
                  location /.well-known/acme-challenge/ {
                      root {{ acme_webroot }};
                  }
    
                  location / {
                      return 301 https://$host:{{ nginx_https_port }}$request_uri;
                  }
              }
    
              server {
                  listen {{ nginx_https_port }} ssl http2;
                  server_name {{ domain }};
    
                  ssl_certificate {{ cert_dir }}/fullchain.cer;
                  ssl_certificate_key {{ cert_dir }}/private.key;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    
                  location / {
                      return 200 "OK";
                  }
              }
    
              server {
                  listen {{ nginx_https_port }} ssl http2;
                  server_name {{ panel_domain }};
    
                  ssl_certificate {{ cert_dir }}/fullchain.cer;
                  ssl_certificate_key {{ cert_dir }}/private.key;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    
                  location {{ panel_proxy_path }} {
                      proxy_pass http://127.0.0.1:{{ panel_port }};
                      proxy_http_version 1.1;
                      proxy_set_header Upgrade $http_upgrade;
                      proxy_set_header Connection "upgrade";
                      proxy_set_header Host $host;
                      proxy_set_header X-Real-IP $remote_addr;
                      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
    
                  location / {
                      return 200 "OK";
                  }
              }
            dest: "/etc/nginx/sites-available/3x-ui-{{ domain }}.conf"
            mode: '0644'
          when: cert_is_valid | default(false) and (panel_external_access | bool)
    
        # ---------- Применение конфигурации ----------
        - name: Включение сайта
          ansible.builtin.file:
            src: "/etc/nginx/sites-available/3x-ui-{{ domain }}.conf"
            dest: "/etc/nginx/sites-enabled/3x-ui-{{ domain }}.conf"
            state: link
            force: yes
          when: cert_is_valid | default(false)
    
        - name: Проверка конфигурации nginx
          ansible.builtin.shell: |
            nginx -t
          register: nginx_final_test
          when: cert_is_valid | default(false)
          ignore_errors: yes
    
        - name: Вывод ошибки конфигурации
          ansible.builtin.debug:
            var: nginx_final_test.stderr_lines
          when:
            - nginx_final_test is defined
            - nginx_final_test.rc | default(0) != 0
    
        - name: Перезапуск nginx
          ansible.builtin.systemd:
            name: nginx
            state: restarted
            daemon_reload: yes
          when:
            - nginx_final_test is defined
            - nginx_final_test.rc | default(1) == 0
    
        - name: Проверка доступности порта {{ nginx_https_port }}
          ansible.builtin.wait_for:
            port: "{{ nginx_https_port }}"
            state: started
            delay: 2
            timeout: 10
          when:
            - nginx_final_test is defined
            - nginx_final_test.rc | default(1) == 0
      tags:
        - nginx_final_configure



    # ============================================================
    # TAG: docker_install
    # ============================================================
    - name: "[docker_install] Установка Docker"
      block:
        - name: Удаление пакетов Docker из репозитория (Ubuntu)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.ubuntu }}"
            state: absent
          when:
            - docker_install_method == "official_script"
            - distro_name == 'ubuntu'

        - name: Удаление пакетов Docker из репозитория (Debian)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.debian }}"
            state: absent
          when:
            - docker_install_method == "official_script"
            - distro_name == 'debian'

        - name: Удаление пакетов Docker из репозитория (CentOS/RHEL)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.centos }}"
            state: absent
          when:
            - docker_install_method == "official_script"
            - distro_name in ['centos', 'red hat', 'redhat']

        - name: Удаление пакетов Docker из репозитория (Fedora)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.fedora }}"
            state: absent
          when:
            - docker_install_method == "official_script"
            - distro_name == 'fedora'

        - name: Загрузка и выполнение официального скрипта Docker
          ansible.builtin.shell: |
            curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
            sh /tmp/get-docker.sh
            rm -f /tmp/get-docker.sh
          args:
            creates: /usr/bin/docker
          when: docker_install_method == "official_script"

        - name: Установка Docker из репозитория (Ubuntu)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.ubuntu }}"
            state: present
          when:
            - docker_install_method == "distribution"
            - distro_name == 'ubuntu'

        - name: Установка Docker из репозитория (Debian)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.debian }}"
            state: present
          when:
            - docker_install_method == "distribution"
            - distro_name == 'debian'

        - name: Установка Docker из репозитория (CentOS/RHEL)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.centos }}"
            state: present
          when:
            - docker_install_method == "distribution"
            - distro_name in ['centos', 'red hat', 'redhat']

        - name: Установка Docker из репозитория (Fedora)
          ansible.builtin.package:
            name: "{{ docker_distro_packages.fedora }}"
            state: present
          when:
            - docker_install_method == "distribution"
            - distro_name == 'fedora'
      tags:
        - docker_install



    # ============================================================
    # TAG: 3xui_deploy
    # ============================================================
    - name: "[3xui_deploy] Развертывание 3X-UI в Docker"
      block:
        - name: Проверить, кто слушает порт {{ xray_port }}
          ansible.builtin.shell: |
            ss -tlnp | grep ':{{ xray_port }}' || echo "PORT_FREE"
          register: port_usage
          changed_when: false
    
        - name: Вывести, кто занял порт
          ansible.builtin.debug:
            var: port_usage.stdout_lines
    
        - name: Остановить nginx, если он держит порт {{ xray_port }}
          ansible.builtin.systemd:
            name: nginx
            state: stopped
          when: "'nginx' in port_usage.stdout"
    
        - name: Принудительно освободить порт {{ xray_port }} (если занят)
          ansible.builtin.shell: |
            fuser -k {{ xray_port }}/tcp || true
          when: "'PORT_FREE' not in port_usage.stdout"
    
        - name: Создание docker-compose.yml
          ansible.builtin.copy:
            content: |
              services:
                3x-ui:
                  image: ghcr.io/mhsanaei/3x-ui:latest
                  container_name: 3x-ui
                  network_mode: host
                  volumes:
                    - "{{ db_dir }}:/etc/x-ui/"
                    - "{{ cert_dir }}:/root/cert/"
                  restart: unless-stopped
            dest: "{{ work_dir }}/docker-compose.yml"
            mode: '0644'
    
        - name: Запуск контейнера через docker compose
          community.docker.docker_compose_v2:
            project_src: "{{ work_dir }}"
            state: present
          register: compose_result
    
        - name: Ожидание запуска 3X-UI
          ansible.builtin.wait_for:
            port: "{{ panel_port }}"
            state: started
            delay: 5
            timeout: 60
    
        - name: Проверка логов контейнера при ошибке
          ansible.builtin.shell: |
            docker logs 3x-ui 2>&1 | tail -30
          register: container_logs
          when: compose_result.failed | default(false)
          ignore_errors: yes
    
        - name: Вывод логов контейнера
          ansible.builtin.debug:
            var: container_logs.stdout_lines
          when: container_logs.stdout_lines is defined
    
        - name: Запуск nginx после освобождения порта (если он работал ранее)
          ansible.builtin.systemd:
            name: nginx
            state: started
          when:
            - "'nginx' in port_usage.stdout"
            - compose_result.changed or compose_result.rc | default(0) == 0
          ignore_errors: yes
      tags:
        - 3xui_deploy





    # ============================================================
    # TAG: 3xui_configure
    # ============================================================
    - name: "[3xui_configure] Проверка входа в панель (без сброса базы)"
      block:
        - name: Попытка входа с admin/admin
          ansible.builtin.shell: |
            COOKIE=$(mktemp)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -c "$COOKIE" -X POST \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"admin"}' \
              "http://127.0.0.1:{{ panel_port }}/login")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "ADMIN_OK"
            else
              echo "ADMIN_FAILED"
            fi
            rm -f "$COOKIE"
          register: admin_check
          changed_when: false
    
        - name: Попытка входа с заданным паролем (если admin не сработал)
          ansible.builtin.shell: |
            COOKIE=$(mktemp)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -c "$COOKIE" -X POST \
              -H "Content-Type: application/json" \
              -d '{"username":"{{ panel_user }}","password":"{{ panel_pass }}"}' \
              "http://127.0.0.1:{{ panel_port }}/login")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "CUSTOM_OK"
            else
              echo "CUSTOM_FAILED"
            fi
            rm -f "$COOKIE"
          register: custom_check
          when: "'ADMIN_OK' not in admin_check.stdout"
          changed_when: false
    
        - name: Вывод статуса входа
          ansible.builtin.debug:
            msg: |
              Вход admin/admin: {{ 'успешно' if 'ADMIN_OK' in admin_check.stdout else 'не удался' }}
              Вход {{ panel_user }}/{{ panel_pass }}: {{ 'успешно' if 'CUSTOM_OK' in custom_check.stdout | default('') else 'не удался' }}
      tags:
        - 3xui_configure




    # ============================================================
    # TAG: inbound_create
    # ============================================================
    - name: "[inbound_create] Автоматизация через API-токен (без логина)"
      block:
        # ---------- Сброс базы (по флагу) ----------
        - name: Сброс базы данных 3X-UI (по требованию)
          ansible.builtin.shell: |
            docker exec 3x-ui rm -f /etc/x-ui/x-ui.db
            docker restart 3x-ui
          when: reset_3xui_db | bool
    
        - name: Ожидание перезапуска контейнера (если был сброс)
          ansible.builtin.wait_for:
            port: "{{ panel_port }}"
            state: started
            delay: 5
            timeout: 30
          when: reset_3xui_db | bool
    
        # ---------- Установка jq ----------
        - name: Проверка наличия jq и установка
          block:
            - name: Проверить jq
              ansible.builtin.shell: which jq || echo "NOT_FOUND"
              register: jq_check
              changed_when: false
            - name: Установить jq
              ansible.builtin.package:
                name: jq
                state: present
              when: "'NOT_FOUND' in jq_check.stdout"
    
        # ---------- Поиск существующего inbound ----------
        - name: Получить список inbound
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/list"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
              Accept: "application/json"
            return_content: yes
            status_code: 200
          register: inbound_list
    
        - name: Извлечь ID inbound с портом {{ xray_port }} и протоколом vless
          ansible.builtin.set_fact:
            inbound_id: "{{ (inbound_list.json.obj | selectattr('port', 'equalto', xray_port|int) | selectattr('protocol', 'equalto', 'vless') | first).id | default('') }}"
    
        # ---------- Создание inbound, если не найден ----------
        - name: Создать inbound (если отсутствует)
          when: inbound_id == ''
          block:
            - name: Генерация UUID клиента
              ansible.builtin.shell: cat /proc/sys/kernel/random/uuid
              register: client_uuid
    
            - name: Создание inbound через API
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/add"
                method: POST
                headers:
                  Authorization: "Bearer {{ panel_api_token }}"
                  Content-Type: "application/json"
                body_format: json
                body:
                  enable: true
                  remark: "VLESS-TCP-Reality"
                  listen: "0.0.0.0"
                  port: "{{ xray_port }}"
                  protocol: "vless"
                  settings:
                    clients:
                      - id: "{{ client_uuid.stdout }}"
                        email: "default@{{ domain }}"
                        flow: "xtls-rprx-vision"
                        enable: true
                    decryption: "none"
                  streamSettings:
                    network: "tcp"
                    security: "reality"
                    realitySettings:
                      show: false
                      xver: 0
                      dest: "{{ reality_dest }}"
                      serverNames:
                        - "{{ reality_server_name }}"
                      privateKey: ""
                      publicKey: ""
                      shortIds:
                        - "6a8c5e3e1b2f4d7a"
                  sniffing:
                    enabled: true
                    destOverride:
                      - "http"
                      - "tls"
                      - "quic"
              register: inbound_creation
    
            - name: Извлечь ID созданного inbound
              ansible.builtin.set_fact:
                inbound_id: "{{ inbound_creation.json.obj.id | default('') }}"
              when: inbound_creation.json.success | default(false)
    
        - name: Остановка, если inbound не создан
          ansible.builtin.fail:
            msg: "Не удалось ни найти, ни создать inbound."
          when: inbound_id == ''
    
        # ---------- Получение данных inbound (UUID клиента, ключи) ----------
        - name: Получить данные inbound
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/get/{{ inbound_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
            return_content: yes
          register: inbound_details
    
        - name: Сохранить UUID клиента для connection_info
          ansible.builtin.set_fact:
            client_uuid_final: "{{ inbound_details.json.obj.settings.clients[0].id }}"
    
        # ---------- Генерация Reality-ключей, если нужно ----------
        - name: Проверить наличие приватного ключа
          ansible.builtin.set_fact:
            existing_privkey: "{{ inbound_details.json.obj.streamSettings.realitySettings.privateKey | default('') }}"
    
        - name: Генерация Reality-ключей (если приватный ключ пуст)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/generateRealityKeyPair/{{ inbound_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
          when: existing_privkey == ''
    
        # ---------- Правило маршрутизации ----------
        - name: Добавить правило маршрутизации tcp,udp → direct (попытка)
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/{{ inbound_id }}/routing/add"
            method: POST
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
              Content-Type: "application/json"
            body_format: json
            body:
              type: "field"
              outboundTag: "direct"
              network: "tcp,udp"
          ignore_errors: yes
    
        # ---------- Получение vless-ссылки ----------
        - name: Получить ссылку клиента
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/clients/links/default@{{ domain }}"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
            return_content: yes
          register: client_links
    
        - name: Извлечь vless-ссылку
          ansible.builtin.set_fact:
            vless_url: "{{ client_links.json.obj[0] | default('') }}"
    
        - name: Вывод готовой ссылки
          ansible.builtin.debug:
            msg: "VLESS-ссылка для подключения: {{ vless_url }}"
          when: vless_url != ''
      tags:
        - inbound_create




    # ============================================================
    # TAG: client_config_export
    # ============================================================
    - name: "[client_config_export] Генерация клиентского JSON (надёжная версия)"
      block:
        # ---------- Поиск inbound ----------
        - name: Получить список inbound
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/list"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
            return_content: yes
            status_code: 200
          register: inbound_list
    
        - name: Найти ID inbound с портом {{ xray_port }} и протоколом vless
          ansible.builtin.set_fact:
            inbound_id: "{{ (inbound_list.json.obj | selectattr('port', 'equalto', xray_port|int) | selectattr('protocol', 'equalto', 'vless') | first).id | default('') }}"
    
        - name: Остановка, если inbound не найден
          ansible.builtin.fail:
            msg: "Не найден inbound для порта {{ xray_port }}. Создайте его перед запуском."
          when: inbound_id == ''
    
        # ---------- Получение деталей inbound (явное сохранение) ----------
        - name: Запросить детали inbound
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/get/{{ inbound_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
            return_content: yes
            status_code: 200
          register: get_inbound_resp
    
        - name: Сохранить тело ответа как факт
          ansible.builtin.set_fact:
            inbound_raw: "{{ get_inbound_resp.content | from_json }}"
    
        - name: Извлечь Reality и клиентов
          ansible.builtin.set_fact:
            reality: "{{ inbound_raw.obj.streamSettings.realitySettings }}"
            clients: "{{ inbound_raw.obj.settings.clients }}"
    
        # ---------- Генерация ключей Reality, если приватный ключ пуст ----------
        - name: Проверить приватный ключ
          ansible.builtin.set_fact:
            priv_key_empty: "{{ reality.privateKey | default('') == '' }}"
    
        - name: Генерация Reality-ключей
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/generateRealityKeyPair/{{ inbound_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
          when: priv_key_empty
    
        - name: Перечитать inbound после генерации ключей
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/get/{{ inbound_id }}"
            method: GET
            headers:
              Authorization: "Bearer {{ panel_api_token }}"
            return_content: yes
            status_code: 200
          register: get_inbound_resp2
          when: priv_key_empty
    
        - name: Обновить inbound_raw после генерации ключей
          ansible.builtin.set_fact:
            inbound_raw: "{{ get_inbound_resp2.content | from_json }}"
          when: priv_key_empty
    
        - name: Переопределить reality и clients после обновления
          ansible.builtin.set_fact:
            reality: "{{ inbound_raw.obj.streamSettings.realitySettings }}"
            clients: "{{ inbound_raw.obj.settings.clients }}"
          when: priv_key_empty
    
        # ---------- Создание клиента, если нет ----------
        - name: Создать клиента, если отсутствует
          when: clients | length == 0
          block:
            - name: Генерация UUID клиента
              ansible.builtin.shell: cat /proc/sys/kernel/random/uuid
              register: new_uuid
    
            - name: Создание клиента через API
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ panel_port }}/panel/api/clients/add"
                method: POST
                headers:
                  Authorization: "Bearer {{ panel_api_token }}"
                  Content-Type: "application/json"
                body_format: json
                body:
                  client:
                    email: "default@{{ domain }}"
                    id: "{{ new_uuid.stdout }}"
                    flow: "xtls-rprx-vision"
                    totalGB: 0
                    expiryTime: 0
                    limitIp: 0
                    enable: true
                  inboundIds:
                    - "{{ inbound_id }}"
              register: client_add
    
            - name: Проверить успешность
              ansible.builtin.fail:
                msg: "Не удалось создать клиента. Ответ: {{ client_add.json }}"
              when: client_add.json.success is defined and not client_add.json.success
    
            - name: Перечитать inbound после создания клиента
              ansible.builtin.uri:
                url: "http://127.0.0.1:{{ panel_port }}/panel/api/inbounds/get/{{ inbound_id }}"
                method: GET
                headers:
                  Authorization: "Bearer {{ panel_api_token }}"
                return_content: yes
                status_code: 200
              register: get_inbound_resp3
    
            - name: Обновить inbound_raw после создания клиента
              ansible.builtin.set_fact:
                inbound_raw: "{{ get_inbound_resp3.content | from_json }}"
    
            - name: Обновить reality и clients
              ansible.builtin.set_fact:
                reality: "{{ inbound_raw.obj.streamSettings.realitySettings }}"
                clients: "{{ inbound_raw.obj.settings.clients }}"
    
        # ---------- Формирование JSON ----------
        - name: Установить данные первого клиента
          ansible.builtin.set_fact:
            client_uuid: "{{ clients[0].id }}"
            client_flow: "{{ clients[0].flow | default('xtls-rprx-vision') }}"
    
        - name: Сформировать клиентский JSON (максимально похожий на образец)
          ansible.builtin.set_fact:
            client_config:
              inbounds:
                - listen: "127.0.0.1"
                  port: 10808
                  protocol: "socks"
                  settings:
                    auth: "noauth"
                    udp: true
                  sniffing:
                    destOverride: ["http", "tls", "quic"]
                    enabled: true
                    routeOnly: true
                  tag: "socks"
                - listen: "127.0.0.1"
                  port: 10809
                  protocol: "http"
                  settings:
                    allowTransparent: false
                  sniffing:
                    destOverride: ["http", "tls", "quic"]
                    enabled: true
                    routeOnly: true
                  tag: "http"
              log:
                dnsLog: true
                loglevel: "Warning"
              observatory:
                enableConcurrency: true
                probeInterval: "30s"
                probeUrl: "https://www.cloudflare.com/cdn-cgi/trace"
                subjectSelector:
                  - "proxy"
              outbounds:
                - protocol: "vless"
                  settings:
                    vnext:
                      - address: "{{ domain }}"
                        port: "{{ xray_port }}"
                        users:
                          - id: "{{ client_uuid }}"
                            encryption: "none"
                            flow: "{{ client_flow }}"
                  streamSettings:
                    network: "raw"
                    security: "reality"
                    realitySettings:
                      fingerprint: "{{ reality.settings.fingerprint }}"
                      serverName: "{{ reality.serverNames[0] }}"
                      publicKey: "{{ reality.settings.publicKey }}"
                      shortId: "{{ reality.shortIds[0] }}"
                      spiderX: "/"
                      show: false
                  tag: "proxy"
                - protocol: "freedom"
                  tag: "direct"
                - protocol: "blackhole"
                  tag: "block"
              routing:
                domainMatcher: "hybrid"
