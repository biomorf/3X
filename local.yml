    # ============================================================
    # TAG: connection_info
    # ============================================================
    - name: "[connection_info] Вывод данных для подключения"
      block:
        - name: Получение внешнего IP сервера
          ansible.builtin.shell: |
            curl -s ifconfig.me
          register: ext_ip
          changed_when: false
    
        - name: Формирование сообщения с данными
          ansible.builtin.set_fact:
            connection_message: |
              === 3X-UI успешно развернут! ===
              Дата: {{ ansible_date_time.date }} {{ ansible_date_time.time }}
              Дистрибутив: {{ ansible_distribution }}
              
              {% if panel_external_access | bool %}
              Панель управления доступна снаружи:
                https://{{ panel_domain }}:{{ nginx_https_port }}{{ panel_proxy_path }}
                Логин: {{ panel_user }}
                Пароль: {{ panel_pass }}
              {% endif %}
              Доступ к панели через SSH-туннель:
                ssh -L 12053:127.0.0.1:{{ panel_port }} {{ ansible_user }}@{{ ext_ip.stdout }}
                Затем откройте http://127.0.0.1:12053
                Логин: {{ panel_user }}
                Пароль: {{ panel_pass }}
        
              VLESS+TCP+Reality:
                Адрес: {{ domain }}
                Порт: {{ xray_port }}
                UUID: {{ client_uuid_final }}
                Flow: xtls-rprx-vision
                Security: reality
                SNI: {{ reality_server_name }}
                Fingerprint: chrome
                
              Клиентский JSON-конфиг: /root/client-config.json
              Скачайте командой:
                scp {{ ansible_user }}@{{ ext_ip.stdout }}:/root/client-config.json ./
        - name: Вывод данных в консоль
          ansible.builtin.debug:
            msg: "{{ connection_message }}"
    
        - name: Сохранение учетных данных в файл
          ansible.builtin.copy:
            content: "{{ connection_message }}"
            dest: "/root/vpn-credentials.txt"
            mode: '0600'
    
        - name: Добавление записи в лог деплоев
          ansible.builtin.lineinfile:
            path: /root/vpn-deploy.log
            line: "========================================"
            create: yes
            mode: '0600'
    
        - name: Добавление даты в лог
          ansible.builtin.lineinfile:
            path: /root/vpn-deploy.log
            line: "Дата: {{ ansible_date_time.date }} {{ ansible_date_time.time }}"
    
        - name: Добавление данных в лог
          ansible.builtin.blockinfile:
            path: /root/vpn-deploy.log
            block: "{{ connection_message }}"
            marker: ""
    
        - name: Проверка сохранённых файлов
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "/root/vpn-credentials.txt"
            - "/root/vpn-deploy.log"
          register: saved_files
    
        - name: Вывод информации о сохранённых файлах
          ansible.builtin.debug:
            msg: |
              Файлы сохранены на сервере:
              - /root/vpn-credentials.txt ({{ (saved_files.results[0].stat.size | default(0)) }} байт)
              - /root/vpn-deploy.log ({{ (saved_files.results[1].stat.size | default(0)) }} байт)
      tags:
        - connection_info
